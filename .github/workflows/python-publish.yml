name: Use Global Python Checks

on:
  push:
    branches: ["main", "develop", "dev", "feature/*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write  # ✅ Repo-level write
  pull-requests: write

jobs:
  python-quality-checks:
    # Explicitly pass write permissions to reusable workflow
    uses: sanjaydevelopment/org-ci-workflows/.github/workflows/python-checks.yml@main
    secrets: inherit
    permissions:  # ✅ JOB-LEVEL: This overrides defaults for the reusable workflow
      contents: read
      issues: write  # Key: Enables gh issue create
      pull-requests: write

  notify-results:
    needs: python-quality-checks
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Notify on completion
        run: |
          if [ "${{ needs.python-quality-checks.result }}" = "success" ]; then
            echo "🎉 All Python checks passed successfully!"
          else
            echo "⚠️ Some Python checks failed. Please review the workflow results."
          fi
